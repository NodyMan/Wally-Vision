services:
  - type: web
    name: skyblink-api
    runtime: python
    rootDir: backend
    plan: free   # no card charge; free services sleep after 15 min idle and have no disk
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn skyblink.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SKYBLINK_MAX_JOBS      # one IRSA job at a time on a small instance
        value: "1"
      - key: SKYBLINK_ALLOW_COLD    # set to "0" to serve only cached fields if the server struggles
        value: "1"
      - key: NUM_PROXIES
        value: "1"
      - key: CACHE_DIR
        value: /tmp/skyblink-cache   # wiped on restart; the five presets ship in the repository
      - key: DATABASE_URL
        value: sqlite:////tmp/db.sqlite3   # findings are lost on restart (free plan has no disk)
